<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Congelados Claudio</title>
<style>
  :root { --bg:#f3f6f9; --card:#fff; --tx:#16202b; --mut:#5d6b7a; --ok:#1a7f4b; --err:#b42318; --acc:#0b5cab; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--tx); padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:32px; max-width:420px; width:100%;
          box-shadow:0 2px 20px rgba(0,0,0,.06); text-align:center; }
  h1 { margin:0 0 4px; font-size:1.5rem; color:var(--acc); }
  p { margin:0; color:var(--mut); }
  #estado { margin-top:24px; padding:12px; border-radius:10px; background:var(--bg); font-weight:600; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
  <main class="card">
    <h1>❄️ Congelados Claudio</h1>
    <p>Sistema de gestión · en construcción</p>
    <div id="estado">Verificando conexión con la base…</div>
  </main>
  <script src="config.js"></script>
  <script>
    (async () => {
      const el = document.getElementById('estado');
      const { SUPABASE_URL: url, SUPABASE_ANON_KEY: key } = window.APP_CONFIG || {};
      if (!url || url.includes('TU-PROYECTO')) {
        el.innerHTML = '<span class="err">Falta completar frontend/config.js</span>'; return;
      }
      try {
        const r = await fetch(url + '/auth/v1/health', { headers: { apikey: key } });
        el.innerHTML = r.ok ? '<span class="ok">✓ Conectado a Supabase</span>'
                            : '<span class="err">Supabase respondió ' + r.status + ' (revisá la anon key)</span>';
      } catch (e) {
        el.innerHTML = '<span class="err">No se pudo conectar (revisá la URL)</span>';
      }
    })();
  </script>
</body>
</html>
