<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a43">
<title>Ingresar · Congelados Claudio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login-fondo">
  <main class="login-caja" style="padding-bottom:28px">
    <div class="marca"><span class="copo" aria-hidden="true">❄️</span><h1>Congelados Claudio</h1></div>
    <p class="suave">Sistema de ventas y stock</p>

    <div id="mensaje" class="aviso-caja" hidden></div>

    <!-- Ingreso -->
    <form id="form-login" autocomplete="on">
      <div class="campo">
        <label for="email">Mail</label>
        <input id="email" type="email" autocomplete="username" required inputmode="email">
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn ancho" type="submit" id="btn-entrar">Entrar</button>
      <button class="enlace" type="button" id="btn-olvide">Olvidé mi contraseña</button>
    </form>

    <!-- Nueva contraseña (llega desde el mail de recuperación) -->
    <form id="form-nueva" hidden>
      <p>Elegí tu nueva contraseña.</p>
      <div class="campo">
        <label for="nueva">Nueva contraseña</label>
        <input id="nueva" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="campo">
        <label for="nueva2">Repetila</label>
        <input id="nueva2" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn ancho" type="submit">Guardar contraseña</button>
    </form>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="js/comun.js"></script>
<script>
(async () => {
  const { sb, $, toast, mensajeError } = CC;
  const msg = (texto, tipo = 'error') => { const el = $('#mensaje'); el.textContent = texto; el.className = 'aviso-caja ' + tipo; el.hidden = !texto; };

  if (new URLSearchParams(location.search).has('sin_acceso')) {
    msg('Tu usuario no tiene acceso activo. Pedile al administrador que te habilite.', 'aviso');
  }

  // Llegada desde el mail de "recuperar contraseña"
  let recuperando = false;
  sb.auth.onAuthStateChange((evento) => {
    if (evento === 'PASSWORD_RECOVERY') {
      recuperando = true;
      $('#form-login').hidden = true;
      $('#form-nueva').hidden = false;
      msg('');
    }
  });

  // Si ya hay sesión, directo a la app
  const { data: { session } } = await sb.auth.getSession();
  if (session && !location.hash.includes('type=recovery')) { location.replace('app.html'); return; }

  $('#form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#btn-entrar');
    btn.disabled = true; btn.textContent = 'Entrando…'; msg('');
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#clave').value });
      if (error) throw error;
      const { data: perfil } = await sb.from('perfiles').select('rol, activo').eq('user_id', data.user.id).maybeSingle();
      if (!perfil || !perfil.activo) {
        await sb.auth.signOut();
        throw new Error('Tu usuario no tiene acceso activo. Pedile al administrador que te habilite.');
      }
      location.replace('app.html');
    } catch (err) {
      msg(mensajeError(err));
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });

  $('#btn-olvide').addEventListener('click', async () => {
    const email = $('#email').value.trim();
    if (!email) { msg('Escribí tu mail arriba y volvé a tocar "Olvidé mi contraseña".', 'info'); $('#email').focus(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) msg(mensajeError(error));
    else msg('Si el mail está registrado, te llegó un enlace para cambiar la contraseña.', 'ok');
  });

  $('#form-nueva').addEventListener('submit', async (e) => {
    e.preventDefault();
    if ($('#nueva').value !== $('#nueva2').value) { msg('Las contraseñas no coinciden.'); return; }
    const { error } = await sb.auth.updateUser({ password: $('#nueva').value });
    if (error) { msg(mensajeError(error)); return; }
    toast('Contraseña actualizada', 'ok');
    location.replace('app.html');
  });
})();
</script>
</body>
</html>
